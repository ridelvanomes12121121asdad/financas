<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle da Lavagem</title>
<style>
  :root {
    --bg: #eef3f6;
    --card: #ffffff;
    --ink: #12232e;
    --mut: #5d7280;
    --line: #d3dee5;
    --soft: #e8eef2;
    --brand: #0b6e99;
    --on: #ffffff;
    --novo: #1b7f4b;
    --teste: #b86e00;
    --of: #b3382c;
    --show: #1f5fbf;
    --outros: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a21;
      --card: #17262f;
      --ink: #e8f1f6;
      --mut: #8ca3b1;
      --line: #2a3d49;
      --soft: #1f323e;
      --brand: #3aa8d8;
      --on: #06141c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  .topo-tela {
    padding: 4px 0 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .topo-tela h1 {
    font-size: 34px;
    margin: 0 0 12px;
    line-height: 1.1;
    font-weight: 700;
  }
  .topo-tela .data-destaque {
    font-size: 20px;
    font-weight: 700;
    color: var(--brand);
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }
  .topo-tela .data-destaque small {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--mut);
    margin-top: 4px;
  }
  .topo-tela .subtitulo {
    color: var(--mut);
    margin: 0;
    font-size: 16px;
  }

  .nome-pessoa {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 14px;
  }
  .nome-pessoa .barra {
    width: 8px;
    height: 46px;
    border-radius: 4px;
    flex: none;
  }
  .nome-pessoa h1 { margin: 0; font-size: 34px; }

  .stack { display: grid; gap: 12px; }

  .big {
    min-height: 88px;
    border: 0;
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 26px;
    font-weight: 700;
    box-shadow: inset 0 0 0 2px var(--line);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }
  .big:active { transform: scale(0.97); }
  .big small { display: block; font-size: 15px; font-weight: 500; opacity: 0.85; }

  .nome { color: #fff; box-shadow: none; }
  .ida { background: #334155; color: #fff; box-shadow: none; margin-top: 8px; }
  .hist { background: #475569; color: #fff; box-shadow: none; margin-top: 4px; }
  .t { color: #fff; box-shadow: none; min-height: 72px; font-size: 23px; }
  .novo { background: var(--novo); }
  .teste { background: var(--teste); }
  .of { background: var(--of); }
  .show { background: var(--show); }
  .outros { background: var(--outros); }
  .t.off { opacity: 0.35; }

  /* Faixa que mostra o tipo de veículo escolhido */
  .tipo-atual {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 2px solid var(--line);
    border-left: 10px solid var(--c, var(--brand));
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 24px;
    font-weight: 700;
    color: var(--c, var(--ink));
    margin-bottom: 6px;
  }
  .tipo-atual .bolinha {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: var(--c, var(--brand));
    flex: none;
  }

  .back {
    background: none;
    border: 0;
    color: var(--brand);
    font: inherit;
    font-weight: 600;
    padding: 8px 0;
    cursor: pointer;
  }

  .rotulo {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin: 22px 0 8px;
  }

  input {
    width: 100%;
    font: inherit;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-align: center;
    text-transform: uppercase;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
  }
  input.placa { letter-spacing: 0.2em; text-align: center; text-transform: uppercase; }
  input.carro {
    font-size: 22px;
    letter-spacing: normal;
    text-align: left;
    text-transform: none;
    font-weight: 600;
    padding: 16px 14px;
  }
  input.busca {
    font-size: 20px;
    letter-spacing: normal;
    text-align: left;
    text-transform: none;
    font-weight: 600;
    padding: 14px 16px 14px 46px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='%235d7280' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>");
    background-repeat: no-repeat;
    background-position: 14px center;
    background-size: 22px;
  }
  .save {
    width: 100%;
    margin-top: 22px;
    padding: 18px;
    border: 0;
    border-radius: 12px;
    background: var(--brand);
    color: var(--on);
    font: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }
  .save:disabled { opacity: 0.5; }

  .marcadores {
    display: grid;
    gap: 10px;
    margin-top: 6px;
  }
  .marcadores label {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    user-select: none;
    -webkit-user-select: none;
  }
  .marcadores label .caixa {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 2px solid var(--line);
    background: var(--card);
    display: grid;
    place-items: center;
    flex: none;
    transition: background .12s, border-color .12s;
  }
  .marcadores label .caixa::after {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: transparent;
    transition: background .12s;
  }
  .marcadores label.marcado {
    border-color: var(--brand);
    background: color-mix(in srgb, var(--brand) 8%, var(--card));
  }
  .marcadores label.marcado .caixa {
    border-color: var(--brand);
    background: var(--brand);
  }
  .marcadores label.marcado .caixa::after {
    background: var(--on);
  }

  .filtros-tipo {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .filtros-tipo button {
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 99px;
    padding: 8px 14px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filtros-tipo button .cor {
    width: 10px; height: 10px; border-radius: 3px; flex: none;
    background: var(--c, transparent);
  }
  .filtros-tipo button .cont {
    font-size: 13px;
    font-weight: 700;
    background: var(--soft, #e8eef2);
    color: var(--mut);
    padding: 1px 7px;
    border-radius: 99px;
    min-width: 22px;
    text-align: center;
  }
  .filtros-tipo button.on {
    border-color: var(--c, var(--brand));
    background: color-mix(in srgb, var(--c, var(--brand)) 12%, var(--card));
  }
  .filtros-tipo button.on .cont {
    background: var(--c, var(--brand));
    color: #fff;
  }

  .sec { background: var(--card); border-radius: 12px; padding: 4px 14px; margin-top: 18px; }
  .sec h3 { margin: 10px 0 0; font-size: 19px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--mut); }

  .act { border: 0; background: none; font: inherit; font-weight: 700; padding: 8px 6px; cursor: pointer; }
  .ed { color: var(--brand); }
  .del { color: var(--of); }

  .msg {
    background: var(--card);
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 14px;
    color: var(--mut);
    margin-bottom: 12px;
  }
  .err { border-color: var(--of); color: var(--of); }

  .campo { position: relative; }
  .sugestoes {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 15;
    background: var(--card); border: 2px solid var(--line); border-radius: 12px;
    max-height: 260px; overflow-y: auto; box-shadow: 0 16px 40px rgba(0,0,0,.22);
    padding: 6px;
  }
  .sugestoes[hidden] { display: none; }
  .sugestoes button {
    width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
    padding: 12px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 19px;
    font-weight: 600; display: block;
  }
  .sugestoes button:hover, .sugestoes button.sel { background: var(--line); }
  .sugestoes button b { color: var(--brand); }
  .sugestoes .vazio { padding: 12px 14px; color: var(--mut); font-size: 15px; }

  .cores {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .cores button {
    border: 2px solid var(--line);
    background: var(--card);
    border-radius: 99px;
    padding: 6px 12px 6px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .cores button .bolinha {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
    flex: none;
  }
  .cores button.on {
    border-color: var(--brand);
    background: color-mix(in srgb, var(--brand) 10%, var(--card));
  }

  .bloco-pessoa {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 14px;
    border-left: 6px solid var(--cor);
  }
  .bloco-pessoa h3 {
    font-size: 22px;
    font-weight: 700;
    color: var(--cor);
    margin: 0 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .bloco-pessoa h3 small {
    font-size: 15px;
    color: var(--mut);
    font-weight: 600;
  }
  .carro-linha {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .carro-linha:last-child { border-bottom: 0; }
  .carro-linha .placa {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.05em;
    min-width: 62px;
  }
  .carro-linha .info { flex: 1; min-width: 120px; }
  .carro-linha .info b { display: block; font-size: 17px; font-weight: 600; }
  .carro-linha .info small { color: var(--mut); font-size: 14px; }
  .carro-linha .tipo {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    padding: 3px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .carro-linha .marcas {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .carro-linha .marca {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--soft);
    color: var(--mut);
  }
  .carro-linha .marca.pol  { background: #dbeafe; color: #1e40af; }
  .carro-linha .marca.fora { background: #fef3c7; color: #92400e; }
  .carro-linha .marca.subs { background: #fee2e2; color: #991b1b; }
  @media (prefers-color-scheme: dark) {
    .carro-linha .marca.pol  { background: #172554; color: #93c5fd; }
    .carro-linha .marca.fora { background: #4b2e07; color: #fcd34d; }
    .carro-linha .marca.subs { background: #4c1d1d; color: #fca5a5; }
  }
  .carro-linha .acoes {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .carro-linha .acoes button {
    border: 0;
    background: none;
    font: inherit;
    font-weight: 700;
    padding: 6px 8px;
    cursor: pointer;
    font-size: 15px;
  }

  .busca-vazio {
    text-align: center;
    color: var(--mut);
    padding: 24px 16px;
    font-size: 16px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 99px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 70;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show2 { opacity: 1; }
</style>
</head>
<body>
<main><div id="v"></div></main>
<div id="toast"></div>

<script>
  // ---------- Configuração ----------
  const DB = "https://controle-de-lavagens-78b2e-default-rtdb.firebaseio.com";
  const EQUIPE = {
    Felipe: "#0f766e",
    Marcos: "#be185d",
    Jonathan: "#4338ca",
    Ridelvan: "#c2410c"
  };
  const TIPOS = {
    novo: "Carro novo",
    of: "Oficina",
    teste: "Test drive",
    show: "Showroom",
    outros: "Outros"
  };
  const CORES_TIPO = {
    novo: "#1b7f4b",
    of: "#b3382c",
    teste: "#b86e00",
    show: "#1f5fbf",
    outros: "#6b7280"
  };

  // Fuso fixo de São Luís (America/Fortaleza)
  const FUSO = "America/Fortaleza";
  // Cache local no celular
  const CHAVE_CACHE = "controle-lavagem:cache:v2";

  const MODELOS = [
    "Dolphin Mini", "Dolphin", "Dolphin Surf", "Dolphin SE", "Dolphin Plus", "Dolphin GS",
    "Dolphin G DM-i", "Song Pro", "Song Plus", "Song Ultra", "Seal", "Seal U", "Seal U DM-i",
    "Seal 6 DM-i", "Seal 6 DM-i Touring", "Sealion 5 DM-i", "Sealion 7", "Sealion 08",
    "Atto 2", "Atto 2 DM-i", "Atto 3", "Atto 3 EVO", "Atto 8", "Yuan Plus", "Yuan Pro",
    "Yuan", "Han", "Han EV", "Han DM-i", "Han L", "King", "Shark", "Tang", "Tan", "Qin L",
    "Song L", "Song MAX DM-i", "Song Ultra DM-i", "Song Ultra EV", "Song Pro Flex",
    "Dolphin G DM-i", "Ocean-V Concept", "Xia DM-i", "Datang EV", "Dahan EV"
  ];

  const CORES = [
    { nome: "Branco",  cor: "#ffffff" },
    { nome: "Preto",   cor: "#111111" },
    { nome: "Prata",   cor: "#c0c0c0" },
    { nome: "Cinza",   cor: "#6b7280" },
    { nome: "Azul",    cor: "#2563eb" },
    { nome: "Vermelho",cor: "#dc2626" },
    { nome: "Vinho",   cor: "#7f1d1d" },
    { nome: "Verde",   cor: "#16a34a" },
    { nome: "Amarelo", cor: "#facc15" },
    { nome: "Laranja", cor: "#f97316" },
    { nome: "Marrom",  cor: "#78350f" },
    { nome: "Bege",    cor: "#e7d3b3" },
    { nome: "Dourado", cor: "#b8860b" }
  ];

  // ---------- Estado ----------
  let dia = "";
  let lista = [];
  let idas = [];
  let pessoa = null;
  let etapa = "inicio";
  let edit = null;
  let tipo = null;
  let erro = "";
  let erroIda = "";
  let carregando = true;
  let ocupado = false;
  let busca = "";
  let filtroTipo = "";

  // Controle dos dados e do cache
  let diaDosDados = "";      
  let temLista = false;      
  let temIdas = false;       
  let atualizadoEm = null;   
  let seqCarga = 0;          
  let ultimaCarga = 0;

  const $ = (s) => document.querySelector(s);

  // ---------- Datas (sempre no fuso de São Luís) ----------
  // Calcula o dia da forma correta usando a API Intl, sem depender do relógio do aparelho.
  function diaOperacionalDe(ms) {
    const f = new Intl.DateTimeFormat("en-CA", {
      timeZone: FUSO,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    });
    const p = Object.fromEntries(f.formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
    return p.year + "-" + p.month + "-" + p.day;
  }
  
  function diaOperacional() { return diaOperacionalDe(Date.now()); }
  
  function dataOperacional() {
    const [a, m, d] = diaOperacional().split("-").map(Number);
    return new Date(a, m - 1, d);
  }

  function esc(texto) {
    return String(texto).replace(/[&<>"]/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
    }[c]));
  }
  
  function hora(ts) {
    const n = Number(ts);
    if (!isFinite(n) || n <= 0) return "—";
    return new Date(n).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: FUSO });
  }
  
  function toast(mensagem) {
    const t = $("#toast");
    t.textContent = mensagem;
    t.classList.add("show2");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show2"), 1800);
  }
  
  function avisoErro(mensagem) {
    if (!mensagem) return "";
    return `<div class="msg err">${esc(mensagem)} <button class="act ed" id="tentar">Tentar de novo</button></div>`;
  }
  
  function paraLista(objeto) {
    return Object.entries(objeto || {})
      .map(([id, registro]) => ({ id, ...registro }))
      .sort((a, b) => a.ts - b.ts);
  }
  
  function normalizar(s) {
    return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  }
  
  function textoDataDestaque() {
    return dataOperacional().toLocaleDateString("pt-BR", {
      weekday: "long", day: "numeric", month: "long"
    });
  }
  
  function textoEstado() {
    if (carregando) return "Turno atual · atualizando…";
    if (atualizadoEm) return "Turno atual · atualizado às " + hora(atualizadoEm.getTime());
    return "Turno atual";
  }
  
  function ehModeloBYD(nome) {
    return MODELOS.includes(nome);
  }
  
  function combina(r, termo) {
    const campos = [
      String(r.placa || ""),
      String(r.carro || ""),
      String(r.cor || ""),
      String(r.nome || ""),
      String(TIPOS[r.tipo] || r.tipo || "")
    ];
    return campos.some((c) => normalizar(c).includes(termo));
  }
  
  function aplicarFiltros() {
    const termo = normalizar(busca);
    return lista.filter((r) => {
      if (filtroTipo && r.tipo !== filtroTipo) return false;
      if (termo && !combina(r, termo)) return false;
      return true;
    });
  }

  // ---------- Cache local (localStorage) ----------
  function gravarCache() {
    try {
      localStorage.setItem(CHAVE_CACHE, JSON.stringify({
        dia: diaDosDados,
        lista: lista,
        idas: idas,
        temLista: temLista,
        temIdas: temIdas,
        salvoEm: atualizadoEm ? atualizadoEm.getTime() : null
      }));
    } catch (e) {}
  }
  
  function carregarDoCache() {
    try {
      const texto = localStorage.getItem(CHAVE_CACHE);
      if (!texto) return;
      const c = JSON.parse(texto);
      if (!c || typeof c !== "object") return;
      if (c.dia !== diaOperacional()) return;
      diaDosDados = c.dia;
      if (Array.isArray(c.lista) && c.temLista) { lista = c.lista; temLista = true; }
      if (Array.isArray(c.idas) && c.temIdas) { idas = c.idas; temIdas = true; }
      if (c.salvoEm && isFinite(Number(c.salvoEm))) atualizadoEm = new Date(Number(c.salvoEm));
    } catch (e) {}
  }

  // ---------- Banco ----------
  async function api(metodo, caminho, corpo) {
    let resposta;
    try {
      resposta = await fetch(DB + "/" + caminho + ".json", {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: corpo ? JSON.stringify(corpo) : undefined,
        cache: "no-store"
      });
    } catch (e) {
      throw new Error("Sem conexão com o banco de dados. Verifique a internet.");
    }
    if (resposta.status === 401 || resposta.status === 403) {
      throw new Error("O banco recusou o acesso. Ajuste as regras do Firebase.");
    }
    if (!resposta.ok) throw new Error("Erro do banco de dados (" + resposta.status + ").");
    return resposta.json();
  }

  function sufixoCache() {
    return " Mostrando os dados salvos" + (atualizadoEm ? " às " + hora(atualizadoEm.getTime()) : "") + ".";
  }

  async function carregar() {
    const meu = ++seqCarga;
    dia = diaOperacional();

    if (diaDosDados !== dia) {
      lista = [];
      idas = [];
      temLista = false;
      temIdas = false;
      atualizadoEm = null;
      diaDosDados = dia;
    }

    carregando = true;
    erro = "";
    erroIda = "";
    render();

    try {
      const dados = await api("GET", "lavagens/" + dia);
      if (meu !== seqCarga) return;
      lista = paraLista(dados);
      temLista = true;
    } catch (e) {
      if (meu !== seqCarga) return;
      erro = e.message;
    }

    try {
      const dados = await api("GET", "showroom/" + dia);
      if (meu !== seqCarga) return;
      idas = paraLista(dados);
      temIdas = true;
    } catch (e) {
      if (meu !== seqCarga) return;
      erroIda = e.message;
    }

    if (!erro && !erroIda) atualizadoEm = new Date();
    if (erro && temLista) erro += sufixoCache();
    if (erroIda && temIdas) erroIda += sufixoCache();

    carregando = false;
    ultimaCarga = Date.now();
    gravarCache();
    render();
  }

  // ---------- Showroom ----------
  async function registrarIda(nome) {
    if (ocupado) return;
    ocupado = true;
    try {
      dia = diaOperacional();
      const agora = Date.now();
      await api("POST", "showroom/" + dia, { nome: nome, ts: agora });
      toast(nome + " registrado às " + hora(agora));
      await carregar();
    } catch (e) { erroIda = e.message; render(); }
    ocupado = false;
  }
  
  async function excluirIda(id) {
    if (!confirm("Excluir esta ida ao showroom?")) return;
    try {
      await api("DELETE", "showroom/" + dia + "/" + id);
      toast("Excluído");
      await carregar();
    } catch (e) { erroIda = e.message; render(); }
  }

  // ---------- Excluir carro (do histórico) ----------
  async function excluirCarro(id) {
    if (!id) {
      toast("Não foi possível identificar o registro.");
      return;
    }
    if (!confirm("Excluir este carro?")) return;
    try {
      await api("DELETE", "lavagens/" + dia + "/" + id);
      toast("Excluído");
      await carregar();
    } catch (e) {
      erro = e.message;
      render();
    }
  }

  // ---------- Telas ----------
  function render() {
    if (etapa === "formulario") renderFormulario();
    else if (etapa === "ida") renderIda();
    else if (etapa === "historico") renderHistorico();
    else if (etapa === "colaborador") renderColaborador();
    else renderInicio();

    const tentar = $("#tentar");
    if (tentar) tentar.onclick = carregar;
  }

  function renderInicio() {
    const v = $("#v");
    const botoesNomes = Object.keys(EQUIPE).map((nome) => {
      const total = lista.filter((r) => r.nome === nome).length;
      return `<button class="big nome" style="background:${EQUIPE[nome]}" data-nome="${nome}">
        ${nome}<small>${temLista ? total + " hoje" : "…"}</small>
      </button>`;
    }).join("");

    v.innerHTML = `
      <div class="topo-tela">
        <h1>Controle da Lavagem</h1>
        <p class="data-destaque">${textoDataDestaque()}<small>${textoEstado()}</small></p>
      </div>
      ${avisoErro(erro)}
      <div class="stack">
        ${botoesNomes}
        <button class="big ida" id="botaoIda">
          Idas no Showroom<small>${temIdas ? idas.length + " hoje" : "…"}</small>
        </button>
        <button class="big hist" id="botaoHist">
          Histórico de hoje<small>${temLista ? lista.length + " carros" : "…"}</small>
        </button>
      </div>`;

    v.querySelectorAll("[data-nome]").forEach((b) => {
      b.onclick = () => {
        pessoa = b.dataset.nome;
        etapa = "colaborador";
        render();
      };
    });

    $("#botaoIda").onclick = () => { etapa = "ida"; render(); };
    $("#botaoHist").onclick = () => {
      busca = "";
      filtroTipo = "";
      etapa = "historico";
      render();
    };
  }

  function renderColaborador() {
    const v = $("#v");
    const botoesTipos = Object.keys(TIPOS).map((k) =>
      `<button class="big t ${k}" data-tipo="${k}">${TIPOS[k]}</button>`
    ).join("");

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <div class="nome-pessoa">
          <span class="barra" style="background:${EQUIPE[pessoa]}"></span>
          <h1 style="color:${EQUIPE[pessoa]}">${esc(pessoa)}</h1>
        </div>
        <p class="data-destaque">${textoDataDestaque()}<small>Toque no tipo de serviço</small></p>
      </div>
      ${avisoErro(erro)}
      <div class="stack">${botoesTipos}</div>`;

    $("#voltar").onclick = () => { pessoa = null; etapa = "inicio"; carregar(); };

    v.querySelectorAll("[data-tipo]").forEach((b) => {
      b.onclick = () => {
        tipo = b.dataset.tipo;
        edit = null;
        etapa = "formulario";
        render();
      };
    });
  }

  function renderFormulario() {
    const v = $("#v");
    const tipoAtual = edit ? edit.k : tipo;

    if (!tipoAtual) {
      etapa = "colaborador";
      render();
      return;
    }

    const faixaTipo = `
      <div class="tipo-atual" style="--c:${CORES_TIPO[tipoAtual]}">
        <span class="bolinha"></span>
        ${TIPOS[tipoAtual]}
      </div>`;

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <div class="nome-pessoa">
          <span class="barra" style="background:${EQUIPE[pessoa]}"></span>
          <h1 style="color:${EQUIPE[pessoa]}">${esc(pessoa)}</h1>
        </div>
        <p class="data-destaque">${textoDataDestaque()}<small>${edit ? "Alterar registro" : "Novo registro"}</small></p>
      </div>
      ${faixaTipo}

      <label class="rotulo" for="carro">Modelo do carro</label>
      <div class="campo">
        <input id="carro" class="carro" type="text" placeholder="Digite ou escolha o modelo…" autocomplete="off" autocapitalize="words" spellcheck="false">
        <div class="sugestoes" id="sugestoes" hidden></div>
      </div>

      <label class="rotulo" for="placa">Placa ou chassi</label>
      <input id="placa" class="placa" maxlength="4" autocomplete="off" autocapitalize="characters">

      <label class="rotulo">Cor do veículo</label>
      <div class="cores" id="cores"></div>

      <div id="blocoMarcadores"></div>

      <button class="save" id="salvar">Salvar</button>`;

    const campoCarro = $("#carro");
    const campoPlaca = $("#placa");
    const caixaSug = $("#sugestoes");
    const caixaCores = $("#cores");
    const blocoMarcadores = $("#blocoMarcadores");

    let corSelecionada = edit ? (edit.cor || "") : "";
    let polimento = edit ? !!edit.polimento : false;
    let foraListagem = edit ? !!edit.foraListagem : false;
    let substituido = edit ? !!edit.substituido : false;

    const tipoEscolhido = tipoAtual;

    function renderMarcadores() {
      if (tipoEscolhido !== "novo") {
        blocoMarcadores.innerHTML = "";
        return;
      }
      blocoMarcadores.innerHTML = `
        <div class="marcadores" id="marcadoresBox">
          <label data-chave="polimento" class="${polimento ? "marcado" : ""}">
            <span class="caixa"></span>
            Carro para polimento
          </label>
          <label data-chave="foraListagem" class="${foraListagem ? "marcado" : ""}">
            <span class="caixa"></span>
            Carro fora da listagem
          </label>
          <label data-chave="substituido" class="${substituido ? "marcado" : ""}">
            <span class="caixa"></span>
            Carro substituído
          </label>
        </div>`;

      blocoMarcadores.querySelectorAll("label").forEach((b) => {
        b.onclick = () => {
          const chave = b.dataset.chave;
          if (chave === "polimento") polimento = !polimento;
          if (chave === "foraListagem") foraListagem = !foraListagem;
          if (chave === "substituido") substituido = !substituido;
          b.classList.toggle("marcado");
        };
      });
    }

    campoCarro.value = edit ? (edit.carro || "") : "";
    campoPlaca.value = edit ? edit.placa : "";
    campoCarro.focus();

    renderMarcadores();

    $("#voltar").onclick = () => {
      const voltarParaHistorico = edit && edit.origem === "historico";
      edit = null;
      tipo = null;
      etapa = voltarParaHistorico ? "historico" : "colaborador";
      render();
    };

    let indiceSel = -1;
    function filtrar(termo) {
      const t = normalizar(termo);
      if (!t) return MODELOS.slice();
      const comeca = MODELOS.filter((m) => normalizar(m).startsWith(t));
      const contem = MODELOS.filter((m) => !normalizar(m).startsWith(t) && normalizar(m).includes(t));
      return comeca.concat(contem);
    }
    function destacar(modelo, termo) {
      const t = normalizar(termo);
      if (!t) return modelo;
      const idx = normalizar(modelo).indexOf(t);
      if (idx === -1) return modelo;
      return modelo.slice(0, idx) + "<b>" + modelo.slice(idx, idx + termo.length) + "</b>" + modelo.slice(idx + termo.length);
    }
    function abrir() {
      const termo = campoCarro.value;
      const lm = filtrar(termo);
      indiceSel = -1;
      if (!lm.length) {
        caixaSug.innerHTML = `<div class="vazio">Nenhum modelo encontrado. Você pode digitar mesmo assim.</div>`;
        caixaSug.hidden = false;
        return;
      }
      caixaSug.innerHTML = lm.map((m, i) =>
        `<button type="button" data-modelo="${m}" data-i="${i}">${destacar(m, termo)}</button>`
      ).join("");
      caixaSug.hidden = false;
      caixaSug.querySelectorAll("button").forEach((b) => {
        b.onmousedown = (e) => { e.preventDefault(); escolher(b.dataset.modelo); };
      });
    }
    function fechar() { caixaSug.hidden = true; indiceSel = -1; }
    function escolher(modelo) {
      campoCarro.value = modelo;
      fechar();
      campoPlaca.focus();
    }
    campoCarro.addEventListener("input", abrir);
    campoCarro.addEventListener("focus", abrir);
    campoCarro.addEventListener("blur", () => setTimeout(fechar, 180));
    campoCarro.addEventListener("keydown", (e) => {
      const botoes = caixaSug.querySelectorAll("button");
      if (!botoes.length || caixaSug.hidden) {
        if (e.key === "Enter") { e.preventDefault(); campoPlaca.focus(); }
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        indiceSel = Math.min(indiceSel + 1, botoes.length - 1);
        botoes.forEach((b, i) => b.classList.toggle("sel", i === indiceSel));
        botoes[indiceSel].scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        indiceSel = Math.max(indiceSel - 1, 0);
        botoes.forEach((b, i) => b.classList.toggle("sel", i === indiceSel));
        botoes[indiceSel].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        if (indiceSel >= 0) { e.preventDefault(); escolher(botoes[indiceSel].dataset.modelo); }
        else { e.preventDefault(); fechar(); campoPlaca.focus(); }
      } else if (e.key === "Escape") {
        fechar();
      }
    });

    campoPlaca.addEventListener("input", () => {
      campoPlaca.value = campoPlaca.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase().slice(0, 4);
    });

    caixaCores.innerHTML = CORES.map((c) =>
      `<button type="button" data-cor="${c.nome}">
        <span class="bolinha" style="background:${c.cor}"></span>${c.nome}
      </button>`
    ).join("");

    caixaCores.querySelectorAll("button").forEach((b) => {
      if (b.dataset.cor === corSelecionada) b.classList.add("on");
      b.onclick = () => {
        corSelecionada = b.dataset.cor;
        caixaCores.querySelectorAll("button").forEach((x) =>
          x.classList.toggle("on", x === b)
        );
      };
    });

    async function salvar() {
      const carro = campoCarro.value.trim();
      const placa = campoPlaca.value.trim().toUpperCase();
      if (!carro) { toast("Escolha o modelo do carro"); campoCarro.focus(); return; }
      if (placa.length < 4) { toast("Digite os 4 caracteres"); campoPlaca.focus(); return; }

      let tipoFinal = tipoEscolhido;
      if (!ehModeloBYD(carro)) {
        tipoFinal = "outros";
      }

      const salvaPolimento    = tipoFinal === "novo" ? polimento    : false;
      const salvaForaListagem = tipoFinal === "novo" ? foraListagem : false;
      const salvaSubstituido  = tipoFinal === "novo" ? substituido  : false;

      $("#salvar").disabled = true;
      const veioDoHistorico = edit && edit.origem === "historico";
      try {
        if (edit) {
          await api("PATCH", "lavagens/" + dia + "/" + edit.id, {
            tipo: tipoFinal,
            carro: carro,
            placa: placa,
            cor: corSelecionada,
            polimento: salvaPolimento,
            foraListagem: salvaForaListagem,
            substituido: salvaSubstituido
          });
        } else {
          dia = diaOperacional(); // Usa o dia exato e correto
          await api("POST", "lavagens/" + dia, {
            nome: pessoa,
            tipo: tipoFinal,
            carro: carro,
            placa: placa,
            cor: corSelecionada,
            polimento: salvaPolimento,
            foraListagem: salvaForaListagem,
            substituido: salvaSubstituido,
            ts: Date.now() // Horário exato
          });
        }
        toast("Salvo");
        edit = null;
        tipo = null;
        etapa = veioDoHistorico ? "historico" : "colaborador";
        await carregar();
      } catch (e) {
        erro = e.message;
        edit = null;
        tipo = null;
        etapa = "colaborador";
        render();
      }
    }
    $("#salvar").onclick = salvar;
    campoPlaca.onkeydown = (e) => { if (e.key === "Enter") salvar(); };
  }

  function renderIda() {
    const v = $("#v");
    const botoesNomes = Object.keys(EQUIPE).map((nome) => {
      const total = idas.filter((i) => i.nome === nome).length;
      return `<button class="big nome" style="background:${EQUIPE[nome]}" data-nome="${nome}">
        ${nome}<small>${total} hoje</small>
      </button>`;
    }).join("");

    const recentes = idas.slice().reverse();
    const linhasIdas = recentes.length
      ? recentes.map((i) => `
          <div class="row">
            <div>
              <b style="color:${EQUIPE[i.nome] || "inherit"}">${esc(i.nome)}</b>
              <small>${hora(i.ts)}</small>
            </div>
            <button class="act del" data-excluir="${i.id}">Excluir</button>
          </div>`).join("")
      : `<div class="row" style="color:var(--mut)">Ninguém foi ao showroom hoje</div>`;

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <h1>Idas no Showroom</h1>
        <p class="data-destaque">${textoDataDestaque()}<small>Toque no nome para registrar agora</small></p>
      </div>
      ${avisoErro(erroIda)}
      <div class="stack">${botoesNomes}</div>
      <div class="sec">
        <h3>Hoje (${idas.length})</h3>
        ${linhasIdas}
      </div>`;

    $("#voltar").onclick = () => { etapa = "inicio"; carregar(); };
    v.querySelectorAll("[data-nome]").forEach((b) => {
      b.onclick = () => registrarIda(b.dataset.nome);
    });
    v.querySelectorAll("[data-excluir]").forEach((b) => {
      b.onclick = () => excluirIda(b.dataset.excluir);
    });
  }

  function montarBlocosHistorico(filtrados, termo, temFiltro) {
    if (filtrados.length === 0 && (termo || temFiltro)) {
      return `<div class="busca-vazio">Nenhum carro encontrado com esse filtro.</div>`;
    }
    const blocos = Object.keys(EQUIPE).map((nome) => {
      const meus = filtrados.filter((r) => r.nome === nome).slice().reverse();
      if ((termo || temFiltro) && meus.length === 0) return "";
      const linhas = meus.length
        ? meus.map((r) => {
            const partesInfo = [];
            if (r.carro) partesInfo.push(r.carro);
            if (r.cor) partesInfo.push(r.cor);
            const info = partesInfo.length ? partesInfo.join(" · ") : "—";
            const marcas = [];
            if (r.polimento)    marcas.push(`<span class="marca pol">Para polimento</span>`);
            if (r.foraListagem) marcas.push(`<span class="marca fora">Fora da listagem</span>`);
            if (r.substituido)  marcas.push(`<span class="marca subs">Substituído</span>`);
            return `
              <div class="carro-linha">
                <span class="placa">${esc(r.placa)}</span>
                <span class="info">
                  <b>${esc(info)}</b>
                  <small>${hora(r.ts)}</small>
                </span>
                ${marcas.length ? `<span class="marcas">${marcas.join("")}</span>` : ""}
                <span class="tipo" style="background:${CORES_TIPO[r.tipo] || "#666"}">${TIPOS[r.tipo] || r.tipo}</span>
                <span class="acoes">
                  <button class="ed" data-editar="${r.id}">Alterar</button>
                  <button class="del" data-excluir-carro="${r.id}">Excluir</button>
                </span>
              </div>`;
          }).join("")
        : `<div class="row" style="color:var(--mut)">Nenhum carro hoje</div>`;
      return `
        <div class="bloco-pessoa" style="--cor:${EQUIPE[nome]}">
          <h3>${esc(nome)}<small>${meus.length} carro${meus.length === 1 ? "" : "s"}</small></h3>
          ${linhas}
        </div>`;
    }).join("");
    return blocos.trim() ? blocos : `<div class="busca-vazio">Nenhum carro encontrado com esse filtro.</div>`;
  }

  function montarChipsFiltro() {
    const contagem = {};
    Object.keys(TIPOS).forEach((k) => { contagem[k] = 0; });
    lista.forEach((r) => {
      if (contagem[r.tipo] !== undefined) contagem[r.tipo]++;
    });
    const chips = Object.keys(TIPOS).map((k) => {
      const ativo = filtroTipo === k;
      return `<button type="button" data-filtro="${k}" class="${ativo ? "on" : ""}" style="--c:${CORES_TIPO[k]}">
        <span class="cor" style="background:${CORES_TIPO[k]}"></span>${TIPOS[k]}
        <span class="cont">${contagem[k]}</span>
      </button>`;
    }).join("");
    const ativoTodos = filtroTipo === "";
    return `
      <button type="button" data-filtro="" class="${ativoTodos ? "on" : ""}" style="--c:var(--brand)">
        Todos <span class="cont">${lista.length}</span>
      </button>
      ${chips}`;
  }

  function religarAcoesHistorico(v) {
    v.querySelectorAll("[data-editar]").forEach((b) => {
      b.onclick = () => {
        const r = lista.find((x) => x.id === b.dataset.editar);
        if (!r) return;
        pessoa = r.nome;
        tipo = r.tipo;
        edit = {
          id: r.id, k: r.tipo,
          carro: r.carro || "",
          placa: r.placa || "",
          cor: r.cor || "",
          polimento: !!r.polimento,
          foraListagem: !!r.foraListagem,
          substituido: !!r.substituido,
          origem: "historico"
        };
        etapa = "formulario";
        render();
      };
    });
    v.querySelectorAll("[data-excluir-carro]").forEach((b) => {
      b.onclick = () => excluirCarro(b.dataset.excluirCarro);
    });
  }

  function religarChipsFiltro(v) {
    v.querySelectorAll("[data-filtro]").forEach((b) => {
      b.onclick = () => {
        const k = b.dataset.filtro;
        filtroTipo = filtroTipo === k ? "" : k;
        renderHistorico();
      };
    });
  }

  function redesenharListaHistorico(v) {
    v.querySelectorAll(".bloco-pessoa, .busca-vazio, .filtros-tipo").forEach((el) => el.remove());

    const termo = normalizar(busca);
    const filtrados = aplicarFiltros();
    const blocos = montarBlocosHistorico(filtrados, termo, !!filtroTipo);

    const campoBusca = v.querySelector("#busca");
    campoBusca.insertAdjacentHTML("afterend", `<div class="filtros-tipo">${montarChipsFiltro()}</div>` + blocos);

    religarAcoesHistorico(v);
    religarChipsFiltro(v);
  }

  function renderHistorico() {
    const v = $("#v");

    const termo = normalizar(busca);
    const filtrados = aplicarFiltros();
    const blocos = montarBlocosHistorico(filtrados, termo, !!filtroTipo);

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <h1>Histórico de hoje</h1>
        <p class="data-destaque">${textoDataDestaque()}<small>${lista.length} carro${lista.length === 1 ? "" : "s"} lavado${lista.length === 1 ? "" : "s"}</small></p>
        <input id="busca" class="busca" type="text" placeholder="Buscar por chassi, carro, cor…" value="${esc(busca)}" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <div class="filtros-tipo">${montarChipsFiltro()}</div>
      </div>
      ${avisoErro(erro)}
      ${blocos}`;

    $("#voltar").onclick = () => { busca = ""; filtroTipo = ""; etapa = "inicio"; carregar(); };

    const campoBusca = $("#busca");
    campoBusca.addEventListener("input", () => {
      busca = campoBusca.value;
      redesenharListaHistorico(v);
    });

    religarAcoesHistorico(v);
    religarChipsFiltro(v);
  }

  // ---------- Início ----------
  diaDosDados = "";
  carregarDoCache();
  carregar();

  let diaAtualVisivel = diaOperacional();
  setInterval(() => {
    if (etapa === "formulario") return;
    const novoDia = diaOperacional();
    if (novoDia !== diaAtualVisivel) {
      diaAtualVisivel = novoDia;
      carregar();
    }
  }, 30000);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (etapa === "formulario" || ocupado) return;
    if (Date.now() - ultimaCarga < 15000) return;
    carregar();
  });
</script>
