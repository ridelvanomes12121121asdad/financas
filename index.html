<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle da Lavagem</title>
<style>
  :root {
    --bg: #eef3f6;
    --card: #ffffff;
    --ink: #12232e;
    --mut: #5d7280;
    --line: #d3dee5;
    --brand: #0b6e99;
    --on: #ffffff;
    --novo: #1b7f4b;
    --teste: #b86e00;
    --of: #b3382c;
    --fora: #7a45b5;
    --show: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a21;
      --card: #17262f;
      --ink: #e8f1f6;
      --mut: #8ca3b1;
      --line: #2a3d49;
      --brand: #3aa8d8;
      --on: #06141c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 26px; margin: 4px 0 4px; }
  .sub { color: var(--mut); margin: 0 0 14px; }
  .stack { display: grid; gap: 12px; }

  .big {
    min-height: 88px;
    border: 0;
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 26px;
    font-weight: 700;
    box-shadow: inset 0 0 0 2px var(--line);
  }
  .big:active { transform: scale(0.97); }
  .big small { display: block; font-size: 15px; font-weight: 500; opacity: 0.85; }

  .nome { color: #fff; box-shadow: none; }
  .ida { background: #334155; color: #fff; box-shadow: none; margin-top: 8px; }
  .t { color: #fff; box-shadow: none; min-height: 72px; font-size: 23px; }
  .novo { background: var(--novo); }
  .teste { background: var(--teste); }
  .of { background: var(--of); }
  .fora { background: var(--fora); }
  .show { background: var(--show); }
  .t.off { opacity: 0.35; }

  .back {
    background: none;
    border: 0;
    color: var(--brand);
    font: inherit;
    font-weight: 600;
    padding: 8px 0;
  }
  input {
    width: 100%;
    font: inherit;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-align: center;
    text-transform: uppercase;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
  }
  .save {
    width: 100%;
    margin-top: 14px;
    padding: 18px;
    border: 0;
    border-radius: 12px;
    background: var(--brand);
    color: var(--on);
    font: inherit;
    font-size: 22px;
    font-weight: 700;
  }

  .sec { background: var(--card); border-radius: 12px; padding: 4px 14px; margin-top: 18px; }
  .sec h3 { margin: 10px 0 0; font-size: 19px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--mut); }
  .pill {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-left: 6px;
  }
  .act { border: 0; background: none; font: inherit; font-weight: 700; padding: 8px 6px; }
  .ed { color: var(--brand); }
  .del { color: var(--of); }

  .msg {
    background: var(--card);
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 14px;
    color: var(--mut);
    margin-bottom: 12px;
  }
  .err { border-color: var(--of); color: var(--of); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 99px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #toast.show2 { opacity: 1; }
</style>
</head>
<body>
<main><div id="v"></div></main>
<div id="toast"></div>

<script>
  // ---------- Configuração ----------
  const DB = "https://controle-de-lavagens-78b2e-default-rtdb.firebaseio.com";
  const EQUIPE = { Felipe: "#0f766e", Marcos: "#be185d", Jonathan: "#4338ca" };
  const TIPOS = {
    novo: "Carro novo",
    of: "Oficina",
    teste: "Test drive",
    show: "Showroom",
    fora: "Por fora"
  };

  // ---------- Estado ----------
  let dia = "";             // dia carregado (AAAA-MM-DD)
  let lista = [];           // carros registrados hoje
  let idas = [];            // idas ao showroom registradas hoje
  let pessoa = null;        // colaborador selecionado
  let naIda = false;        // true quando está na tela "Idas no Showroom"
  let edit = null;          // registro sendo alterado
  let tipo = null;          // tipo escolhido num novo registro
  let erro = "";            // erro ao carregar/salvar carros
  let erroIda = "";         // erro ao carregar/salvar idas ao showroom
  let carregando = true;
  let ocupado = false;

  // ---------- Utilidades ----------
  const $ = (seletor) => document.querySelector(seletor);

  function hoje() {
    const d = new Date();
    const mes = String(d.getMonth() + 1).padStart(2, "0");
    const diaDoMes = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + mes + "-" + diaDoMes;
  }

  function esc(texto) {
    return String(texto).replace(/[&<>"]/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;"
    }[c]));
  }

  function hora(ts) {
    return new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function toast(mensagem) {
    const t = $("#toast");
    t.textContent = mensagem;
    t.classList.add("show2");
    setTimeout(() => t.classList.remove("show2"), 1800);
  }

  function pill(k) {
    return `<span class="pill ${k}">${TIPOS[k]}</span>`;
  }

  function avisoErro(mensagem) {
    if (!mensagem) return "";
    return `<div class="msg err">${esc(mensagem)} <button class="act ed" id="tentar">Tentar de novo</button></div>`;
  }

  function paraLista(objeto) {
    return Object.entries(objeto || {})
      .map(([id, registro]) => ({ id, ...registro }))
      .sort((a, b) => a.ts - b.ts);
  }

  // ---------- Banco de dados (Firebase Realtime Database) ----------
  async function api(metodo, caminho, corpo) {
    let resposta;
    try {
      resposta = await fetch(DB + "/" + caminho + ".json", {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: corpo ? JSON.stringify(corpo) : undefined
      });
    } catch (e) {
      throw new Error("Sem conexão com o banco de dados. Verifique a internet.");
    }
    if (resposta.status === 401 || resposta.status === 403) {
      throw new Error("O banco recusou o acesso. Ajuste as regras do Firebase.");
    }
    if (!resposta.ok) {
      throw new Error("Erro do banco de dados (" + resposta.status + ").");
    }
    return resposta.json();
  }

  async function carregar() {
    dia = hoje();
    carregando = true;
    erro = "";
    erroIda = "";
    render();

    try {
      lista = paraLista(await api("GET", "lavagens/" + dia));
    } catch (e) {
      erro = e.message;
      lista = [];
    }

    try {
      idas = paraLista(await api("GET", "showroom/" + dia));
    } catch (e) {
      erroIda = e.message;
      idas = [];
    }

    carregando = false;
    render();
  }

  // ---------- Idas no Showroom ----------
  async function registrarIda(nome) {
    if (ocupado) return;
    ocupado = true;
    try {
      dia = hoje();
      const agora = Date.now();
      await api("POST", "showroom/" + dia, { nome: nome, ts: agora });
      toast(nome + " registrado às " + hora(agora));
      await carregar();
    } catch (e) {
      erroIda = e.message;
      render();
    }
    ocupado = false;
  }

  async function excluirIda(id) {
    if (!confirm("Excluir esta ida ao showroom?")) return;
    try {
      await api("DELETE", "showroom/" + dia + "/" + id);
      toast("Excluído");
      await carregar();
    } catch (e) {
      erroIda = e.message;
      render();
    }
  }

  // ---------- Telas ----------
  function render() {
    if (edit || tipo) renderFormulario();
    else if (naIda) renderIda();
    else if (pessoa) renderColaborador();
    else renderInicio();

    const tentar = $("#tentar");
    if (tentar) tentar.onclick = carregar;
  }

  function renderInicio() {
    const v = $("#v");
    const botoesNomes = Object.keys(EQUIPE).map((nome) => {
      const total = lista.filter((r) => r.nome === nome).length;
      return `<button class="big nome" style="background:${EQUIPE[nome]}" data-nome="${nome}">
        ${nome}<small>${carregando ? "…" : total + " hoje"}</small>
      </button>`;
    }).join("");

    const dataTexto = new Date().toLocaleDateString("pt-BR", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    v.innerHTML = `
      <h1>Controle da Lavagem</h1>
      <p class="sub">${dataTexto}</p>
      ${avisoErro(erro)}
      <div class="stack">
        ${botoesNomes}
        <button class="big ida" id="botaoIda">
          Idas no Showroom<small>${carregando ? "…" : idas.length + " hoje"}</small>
        </button>
      </div>`;

    v.querySelectorAll("[data-nome]").forEach((b) => {
      b.onclick = () => { pessoa = b.dataset.nome; render(); };
    });
    $("#botaoIda").onclick = () => { naIda = true; render(); };
  }

  function renderColaborador() {
    const v = $("#v");
    const minhas = lista.filter((r) => r.nome === pessoa).slice().reverse();

    const botoesTipos = Object.keys(TIPOS).map((k) =>
      `<button class="big t ${k}" data-tipo="${k}">${TIPOS[k]}</button>`
    ).join("");

    const linhasHistorico = minhas.length
      ? minhas.map((r) => `
          <div class="row">
            <div><b>${esc(r.placa)}</b>${pill(r.tipo)}<small>${hora(r.ts)}</small></div>
            <div>
              <button class="act ed" data-editar="${r.id}">Alterar</button>
              <button class="act del" data-excluir="${r.id}">Excluir</button>
            </div>
          </div>`).join("")
      : `<div class="row" style="color:var(--mut)">Nenhum carro hoje</div>`;

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <h1 style="color:${EQUIPE[pessoa]}">${esc(pessoa)}</h1>
      <p class="sub">Toque para registrar um carro</p>
      ${avisoErro(erro)}
      <div class="stack">${botoesTipos}</div>
      <div class="sec">
        <h3>Hoje (${minhas.length})</h3>
        ${linhasHistorico}
      </div>`;

    $("#voltar").onclick = () => { pessoa = null; carregar(); };

    v.querySelectorAll("[data-tipo]").forEach((b) => {
      b.onclick = () => { tipo = b.dataset.tipo; render(); };
    });

    v.querySelectorAll("[data-editar]").forEach((b) => {
      b.onclick = () => {
        const r = lista.find((x) => x.id === b.dataset.editar);
        edit = { id: r.id, k: r.tipo, placa: r.placa };
        render();
      };
    });

    v.querySelectorAll("[data-excluir]").forEach((b) => {
      b.onclick = async () => {
        if (!confirm("Excluir este registro?")) return;
        try {
          await api("DELETE", "lavagens/" + dia + "/" + b.dataset.excluir);
          toast("Excluído");
          await carregar();
        } catch (e) {
          erro = e.message;
          render();
        }
      };
    });
  }

  function renderFormulario() {
    const v = $("#v");
    const tipoAtual = edit ? edit.k : tipo;

    const escolhaDeTipo = edit
      ? `<div class="stack">${Object.keys(TIPOS).map((k) =>
          `<button class="big t ${k}${k === tipoAtual ? "" : " off"}" data-tipo="${k}">${TIPOS[k]}</button>`
        ).join("")}</div><br>`
      : `<p class="sub"><b>${TIPOS[tipoAtual]}</b> — últimos 4 dígitos da placa ou chassi</p>`;

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <h1 style="color:${EQUIPE[pessoa]}">${esc(pessoa)}</h1>
      <p class="sub">${edit ? "Alterar registro" : "Novo registro"}</p>
      ${escolhaDeTipo}
      <input id="placa" maxlength="4" autocomplete="off" autocapitalize="characters">
      <button class="save" id="salvar">Salvar</button>`;

    const campo = $("#placa");
    campo.value = edit ? edit.placa : "";
    campo.focus();

    let tipoEscolhido = tipoAtual;
    v.querySelectorAll("[data-tipo]").forEach((b) => {
      b.onclick = () => {
        tipoEscolhido = b.dataset.tipo;
        v.querySelectorAll("[data-tipo]").forEach((x) =>
          x.classList.toggle("off", x.dataset.tipo !== tipoEscolhido)
        );
      };
    });

    $("#voltar").onclick = () => { edit = null; tipo = null; render(); };

    async function salvar() {
      const placa = campo.value.trim().toUpperCase();
      if (placa.length < 4) {
        toast("Digite os 4 caracteres");
        return;
      }
      $("#salvar").disabled = true;
      try {
        if (edit) {
          await api("PATCH", "lavagens/" + dia + "/" + edit.id, { tipo: tipoEscolhido, placa: placa });
        } else {
          dia = hoje();
          await api("POST", "lavagens/" + dia, { nome: pessoa, tipo: tipoEscolhido, placa: placa, ts: Date.now() });
        }
        toast("Salvo");
        edit = null;
        tipo = null;
        await carregar(); // continua na tela do colaborador
      } catch (e) {
        erro = e.message;
        edit = null;
        tipo = null;
        render();
      }
    }

    $("#salvar").onclick = salvar;
    campo.onkeydown = (e) => { if (e.key === "Enter") salvar(); };
  }

  function renderIda() {
    const v = $("#v");

    const botoesNomes = Object.keys(EQUIPE).map((nome) => {
      const total = idas.filter((i) => i.nome === nome).length;
      return `<button class="big nome" style="background:${EQUIPE[nome]}" data-nome="${nome}">
        ${nome}<small>${total} hoje</small>
      </button>`;
    }).join("");

    const recentes = idas.slice().reverse();
    const linhasIdas = recentes.length
      ? recentes.map((i) => `
          <div class="row">
            <div>
              <b style="color:${EQUIPE[i.nome] || "inherit"}">${esc(i.nome)}</b>
              <small>${hora(i.ts)}</small>
            </div>
            <button class="act del" data-excluir="${i.id}">Excluir</button>
          </div>`).join("")
      : `<div class="row" style="color:var(--mut)">Ninguém foi ao showroom hoje</div>`;

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <h1>Idas no Showroom</h1>
      <p class="sub">Quem foi? Toque no nome para registrar agora.</p>
      ${avisoErro(erroIda)}
      <div class="stack">${botoesNomes}</div>
      <div class="sec">
        <h3>Hoje (${idas.length})</h3>
        ${linhasIdas}
      </div>`;

    $("#voltar").onclick = () => { naIda = false; carregar(); };

    v.querySelectorAll("[data-nome]").forEach((b) => {
      b.onclick = () => registrarIda(b.dataset.nome);
    });
    v.querySelectorAll("[data-excluir]").forEach((b) => {
      b.onclick = () => excluirIda(b.dataset.excluir);
    });
  }

  // ---------- Início ----------
  carregar();
</script>
</body>
</html>
