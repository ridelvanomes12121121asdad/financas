<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle da Lavagem</title>
<style>
  :root {
    --bg: #eef3f6;
    --card: #ffffff;
    --ink: #12232e;
    --mut: #5d7280;
    --line: #d3dee5;
    --brand: #0b6e99;
    --on: #ffffff;
    --novo: #1b7f4b;
    --teste: #b86e00;
    --of: #b3382c;
    --show: #1f5fbf;
    --outros: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a21;
      --card: #17262f;
      --ink: #e8f1f6;
      --mut: #8ca3b1;
      --line: #2a3d49;
      --brand: #3aa8d8;
      --on: #06141c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  .topo-tela {
    padding: 4px 0 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .topo-tela h1 {
    font-size: 34px;
    margin: 0 0 12px;
    line-height: 1.1;
    font-weight: 700;
  }
  .topo-tela .data-destaque {
    font-size: 20px;
    font-weight: 700;
    color: var(--brand);
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }
  .topo-tela .data-destaque small {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--mut);
    margin-top: 4px;
  }
  .topo-tela .subtitulo {
    color: var(--mut);
    margin: 0;
    font-size: 16px;
  }

  .nome-pessoa {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 14px;
  }
  .nome-pessoa .barra {
    width: 8px;
    height: 46px;
    border-radius: 4px;
    flex: none;
  }
  .nome-pessoa h1 { margin: 0; font-size: 34px; }

  .stack { display: grid; gap: 12px; }

  .big {
    min-height: 88px;
    border: 0;
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 26px;
    font-weight: 700;
    box-shadow: inset 0 0 0 2px var(--line);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }
  .big:active { transform: scale(0.97); }
  .big small { display: block; font-size: 15px; font-weight: 500; opacity: 0.85; }

  .nome { color: #fff; box-shadow: none; }
  .ida { background: #334155; color: #fff; box-shadow: none; margin-top: 8px; }
  .hist { background: #475569; color: #fff; box-shadow: none; margin-top: 4px; }
  .t { color: #fff; box-shadow: none; min-height: 72px; font-size: 23px; }
  .novo { background: var(--novo); }
  .teste { background: var(--teste); }
  .of { background: var(--of); }
  .show { background: var(--show); }
  .outros { background: var(--outros); }
  .t.off { opacity: 0.35; }

  .back {
    background: none;
    border: 0;
    color: var(--brand);
    font: inherit;
    font-weight: 600;
    padding: 8px 0;
    cursor: pointer;
  }

  .rotulo {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin: 22px 0 8px;
  }
  .rotulo small {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--mut);
    margin-top: 2px;
  }

  input {
    width: 100%;
    font: inherit;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-align: center;
    text-transform: uppercase;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
  }
  input.placa { letter-spacing: 0.2em; text-align: center; text-transform: uppercase; }
  input.carro {
    font-size: 22px;
    letter-spacing: normal;
    text-align: left;
    text-transform: none;
    font-weight: 600;
    padding: 16px 14px;
  }
  input.busca {
    font-size: 20px;
    letter-spacing: normal;
    text-align: left;
    text-transform: none;
    font-weight: 600;
    padding: 14px 16px 14px 46px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='%235d7280' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>");
    background-repeat: no-repeat;
    background-position: 14px center;
    background-size: 22px;
  }
  .save {
    width: 100%;
    margin-top: 22px;
    padding: 18px;
    border: 0;
    border-radius: 12px;
    background: var(--brand);
    color: var(--on);
    font: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }
  .save:disabled { opacity: 0.5; }

  .sec { background: var(--card); border-radius: 12px; padding: 4px 14px; margin-top: 18px; }
  .sec h3 { margin: 10px 0 0; font-size: 19px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--mut); }

  .act { border: 0; background: none; font: inherit; font-weight: 700; padding: 8px 6px; cursor: pointer; }
  .ed { color: var(--brand); }
  .del { color: var(--of); }

  .msg {
    background: var(--card);
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 14px;
    color: var(--mut);
    margin-bottom: 12px;
  }
  .err { border-color: var(--of); color: var(--of); }

  .campo { position: relative; }
  .sugestoes {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 15;
    background: var(--card); border: 2px solid var(--line); border-radius: 12px;
    max-height: 260px; overflow-y: auto; box-shadow: 0 16px 40px rgba(0,0,0,.22);
    padding: 6px;
  }
  .sugestoes[hidden] { display: none; }
  .sugestoes button {
    width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
    padding: 12px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 19px;
    font-weight: 600; display: block;
  }
  .sugestoes button:hover, .sugestoes button.sel { background: var(--line); }
  .sugestoes button b { color: var(--brand); }
  .sugestoes .vazio { padding: 12px 14px; color: var(--mut); font-size: 15px; }

  .cores {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .cores button {
    border: 2px solid var(--line);
    background: var(--card);
    border-radius: 99px;
    padding: 6px 12px 6px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .cores button .bolinha {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
    flex: none;
  }
  .cores button.on {
    border-color: var(--brand);
    background: color-mix(in srgb, var(--brand) 10%, var(--card));
  }

  .bloco-pessoa {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 14px;
    border-left: 6px solid var(--cor);
  }
  .bloco-pessoa h3 {
    font-size: 22px;
    font-weight: 700;
    color: var(--cor);
    margin: 0 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .bloco-pessoa h3 small {
    font-size: 15px;
    color: var(--mut);
    font-weight: 600;
  }
  .carro-linha {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .carro-linha:last-child { border-bottom: 0; }
  .carro-linha .placa {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.05em;
    min-width: 62px;
  }
  .carro-linha .info { flex: 1; min-width: 120px; }
  .carro-linha .info b { display: block; font-size: 17px; font-weight: 600; }
  .carro-linha .info small { color: var(--mut); font-size: 14px; }
  .carro-linha .tipo {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    padding: 3px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .carro-linha .acoes {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .carro-linha .acoes button {
    border: 0;
    background: none;
    font: inherit;
    font-weight: 700;
    padding: 6px 8px;
    cursor: pointer;
    font-size: 15px;
  }

  .busca-vazio {
    text-align: center;
    color: var(--mut);
    padding: 24px 16px;
    font-size: 16px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 99px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 70;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show2 { opacity: 1; }
</style>
</head>
<body>
<main><div id="v"></div></main>
<div id="toast"></div>

<script>
  // ---------- Configuração ----------
  const DB = "https://controle-de-lavagens-78b2e-default-rtdb.firebaseio.com";
  const EQUIPE = { Felipe: "#0f766e", Marcos: "#be185d", Jonathan: "#4338ca" };
  const TIPOS = {
    novo: "Carro novo",
    of: "Oficina",
    teste: "Test drive",
    show: "Showroom",
    outros: "Outros"
  };
  const CORES_TIPO = {
    novo: "#1b7f4b",
    of: "#b3382c",
    teste: "#b86e00",
    show: "#1f5fbf",
    outros: "#6b7280"
  };

  const HORA_VIRADA = 20;

  const MODELOS = [
    "Dolphin Mini", "Dolphin", "Dolphin Surf", "Dolphin SE", "Dolphin Plus", "Dolphin GS",
    "Dolphin G DM-i", "Song Pro", "Song Plus", "Song Ultra", "Seal", "Seal U", "Seal U DM-i",
    "Seal 6 DM-i", "Seal 6 DM-i Touring", "Sealion 5 DM-i", "Sealion 7", "Sealion 08",
    "Atto 2", "Atto 2 DM-i", "Atto 3", "Atto 3 EVO", "Atto 8", "Yuan Plus", "Yuan Pro",
    "Yuan", "Han", "Han EV", "Han DM-i", "Han L", "King", "Shark", "Tang", "Tan", "Qin L",
    "Song L", "Song MAX DM-i", "Song Ultra DM-i", "Song Ultra EV", "Song Pro Flex",
    "Dolphin G DM-i", "Ocean-V Concept", "Xia DM-i", "Datang EV", "Dahan EV"
  ];

  const CORES = [
    { nome: "Branco",  cor: "#ffffff" },
    { nome: "Preto",   cor: "#111111" },
    { nome: "Prata",   cor: "#c0c0c0" },
    { nome: "Cinza",   cor: "#6b7280" },
    { nome: "Azul",    cor: "#2563eb" },
    { nome: "Vermelho",cor: "#dc2626" },
    { nome: "Vinho",   cor: "#7f1d1d" },
    { nome: "Verde",   cor: "#16a34a" },
    { nome: "Amarelo", cor: "#facc15" },
    { nome: "Laranja", cor: "#f97316" },
    { nome: "Marrom",  cor: "#78350f" },
    { nome: "Bege",    cor: "#e7d3b3" },
    { nome: "Dourado", cor: "#b8860b" }
  ];

  // ---------- Estado ----------
  let dia = "";
  let lista = [];
  let idas = [];
  let pessoa = null;
  // "inicio" | "colaborador" | "formulario" | "ida" | "historico"
  let etapa = "inicio";
  let edit = null;
  let tipo = null;
  let erro = "";
  let erroIda = "";
  let carregando = true;
  let ocupado = false;
  let busca = ""; // termo de busca no histórico

  const $ = (s) => document.querySelector(s);

  // ---------- Datas ----------
  function diaOperacional() {
    const agora = new Date();
    if (agora.getHours() >= HORA_VIRADA) agora.setDate(agora.getDate() + 1);
    const mes = String(agora.getMonth() + 1).padStart(2, "0");
    const d = String(agora.getDate()).padStart(2, "0");
    return agora.getFullYear() + "-" + mes + "-" + d;
  }
  function dataOperacional() {
    const agora = new Date();
    if (agora.getHours() >= HORA_VIRADA) agora.setDate(agora.getDate() + 1);
    return agora;
  }

  function esc(texto) {
    return String(texto).replace(/[&<>"]/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
    }[c]));
  }
  function hora(ts) {
    return new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
  function toast(mensagem) {
    const t = $("#toast");
    t.textContent = mensagem;
    t.classList.add("show2");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show2"), 1800);
  }
  function avisoErro(mensagem) {
    if (!mensagem) return "";
    return `<div class="msg err">${esc(mensagem)} <button class="act ed" id="tentar">Tentar de novo</button></div>`;
  }
  function paraLista(objeto) {
    return Object.entries(objeto || {})
      .map(([id, registro]) => ({ id, ...registro }))
      .sort((a, b) => a.ts - b.ts);
  }
  function normalizar(s) {
    return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  }
  function textoDataDestaque() {
    return dataOperacional().toLocaleDateString("pt-BR", {
      weekday: "long", day: "numeric", month: "long"
    });
  }
  // Verifica se o nome digitado é exatamente um dos modelos pré-selecionados (BYD)
  function ehModeloBYD(nome) {
    return MODELOS.includes(nome);
  }

  // ---------- Banco ----------
  async function api(metodo, caminho, corpo) {
    let resposta;
    try {
      resposta = await fetch(DB + "/" + caminho + ".json", {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: corpo ? JSON.stringify(corpo) : undefined
      });
    } catch (e) {
      throw new Error("Sem conexão com o banco de dados. Verifique a internet.");
    }
    if (resposta.status === 401 || resposta.status === 403) {
      throw new Error("O banco recusou o acesso. Ajuste as regras do Firebase.");
    }
    if (!resposta.ok) throw new Error("Erro do banco de dados (" + resposta.status + ").");
    return resposta.json();
  }

  async function carregar() {
    dia = diaOperacional();
    carregando = true;
    erro = "";
    erroIda = "";
    render();
    try { lista = paraLista(await api("GET", "lavagens/" + dia)); }
    catch (e) { erro = e.message; lista = []; }
    try { idas = paraLista(await api("GET", "showroom/" + dia)); }
    catch (e) { erroIda = e.message; idas = []; }
    carregando = false;
    render();
  }

  // ---------- Showroom ----------
  async function registrarIda(nome) {
    if (ocupado) return;
    ocupado = true;
    try {
      dia = diaOperacional();
      const agora = Date.now();
      await api("POST", "showroom/" + dia, { nome: nome, ts: agora });
      toast(nome + " registrado às " + hora(agora));
      await carregar();
    } catch (e) { erroIda = e.message; render(); }
    ocupado = false;
  }
  async function excluirIda(id) {
    if (!confirm("Excluir esta ida ao showroom?")) return;
    try {
      await api("DELETE", "showroom/" + dia + "/" + id);
      toast("Excluído");
      await carregar();
    } catch (e) { erroIda = e.message; render(); }
  }

  // ---------- Excluir carro (do histórico) ----------
  async function excluirCarro(id) {
    if (!confirm("Excluir este carro?")) return;
    try {
      await api("DELETE", "lavagens/" + dia + "/" + id);
      toast("Excluído");
      await carregar();
    } catch (e) {
      erro = e.message;
      render();
    }
  }

  // ---------- Telas ----------
  function render() {
    if (etapa === "formulario") renderFormulario();
    else if (etapa === "ida") renderIda();
    else if (etapa === "historico") renderHistorico();
    else if (etapa === "colaborador") renderColaborador();
    else renderInicio();

    const tentar = $("#tentar");
    if (tentar) tentar.onclick = carregar;
  }

  function renderInicio() {
    const v = $("#v");
    const botoesNomes = Object.keys(EQUIPE).map((nome) => {
      const total = lista.filter((r) => r.nome === nome).length;
      return `<button class="big nome" style="background:${EQUIPE[nome]}" data-nome="${nome}">
        ${nome}<small>${carregando ? "…" : total + " hoje"}</small>
      </button>`;
    }).join("");

    v.innerHTML = `
      <div class="topo-tela">
        <h1>Controle da Lavagem</h1>
        <p class="data-destaque">${textoDataDestaque()}<small>Turno atual</small></p>
      </div>
      ${avisoErro(erro)}
      <div class="stack">
        ${botoesNomes}
        <button class="big ida" id="botaoIda">
          Idas no Showroom<small>${carregando ? "…" : idas.length + " hoje"}</small>
        </button>
        <button class="big hist" id="botaoHist">
          Histórico de hoje<small>${carregando ? "…" : lista.length + " carros"}</small>
        </button>
      </div>`;

    v.querySelectorAll("[data-nome]").forEach((b) => {
      b.onclick = () => {
        pessoa = b.dataset.nome;
        etapa = "colaborador";
        render();
      };
    });

    $("#botaoIda").onclick = () => { etapa = "ida"; render(); };
    $("#botaoHist").onclick = () => { busca = ""; etapa = "historico"; render(); };
  }

  function renderColaborador() {
    const v = $("#v");
    const botoesTipos = Object.keys(TIPOS).map((k) =>
      `<button class="big t ${k}" data-tipo="${k}">${TIPOS[k]}</button>`
    ).join("");

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <div class="nome-pessoa">
          <span class="barra" style="background:${EQUIPE[pessoa]}"></span>
          <h1 style="color:${EQUIPE[pessoa]}">${esc(pessoa)}</h1>
        </div>
        <p class="data-destaque">${textoDataDestaque()}<small>Toque no tipo de serviço</small></p>
      </div>
      ${avisoErro(erro)}
      <div class="stack">${botoesTipos}</div>`;

    $("#voltar").onclick = () => { pessoa = null; etapa = "inicio"; carregar(); };

    v.querySelectorAll("[data-tipo]").forEach((b) => {
      b.onclick = () => {
        tipo = b.dataset.tipo;
        edit = null;
        etapa = "formulario";
        render();
      };
    });
  }

  function renderFormulario() {
    const v = $("#v");
    const tipoAtual = edit ? edit.k : tipo;

    if (!tipoAtual) {
      etapa = "colaborador";
      render();
      return;
    }

    const escolhaDeTipo = edit
      ? `<div class="stack">${Object.keys(TIPOS).map((k) =>
          `<button class="big t ${k}${k === tipoAtual ? "" : " off"}" data-tipo="${k}">${TIPOS[k]}</button>`
        ).join("")}</div>`
      : `<p class="subtitulo" style="margin:0 0 4px">Tipo: <b style="color:${CORES_TIPO[tipoAtual]}">${TIPOS[tipoAtual]}</b></p>`;

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <div class="nome-pessoa">
          <span class="barra" style="background:${EQUIPE[pessoa]}"></span>
          <h1 style="color:${EQUIPE[pessoa]}">${esc(pessoa)}</h1>
        </div>
        <p class="data-destaque">${textoDataDestaque()}<small>${edit ? "Alterar registro" : "Novo registro"}</small></p>
      </div>
      ${escolhaDeTipo}

      <label class="rotulo" for="carro">Modelo do carro
        <small>Digite ou escolha na lista</small>
      </label>
      <div class="campo">
        <input id="carro" class="carro" type="text" placeholder="Digite ou escolha o modelo…" autocomplete="off" autocapitalize="words" spellcheck="false">
        <div class="sugestoes" id="sugestoes" hidden></div>
      </div>

      <label class="rotulo" for="placa">Últimos 4 dígitos da placa ou chassi
        <small>Letras e números</small>
      </label>
      <input id="placa" class="placa" maxlength="4" autocomplete="off" autocapitalize="characters">

      <label class="rotulo">Cor do veículo
        <small>Toque numa cor</small>
      </label>
      <div class="cores" id="cores"></div>

      <button class="save" id="salvar">Salvar</button>`;

    const campoCarro = $("#carro");
    const campoPlaca = $("#placa");
    const caixaSug = $("#sugestoes");
    const caixaCores = $("#cores");

    let corSelecionada = edit ? (edit.cor || "") : "";

    campoCarro.value = edit ? (edit.carro || "") : "";
    campoPlaca.value = edit ? edit.placa : "";
    campoCarro.focus();

    let tipoEscolhido = tipoAtual;

    v.querySelectorAll("[data-tipo]").forEach((b) => {
      b.onclick = () => {
        tipoEscolhido = b.dataset.tipo;
        v.querySelectorAll("[data-tipo]").forEach((x) =>
          x.classList.toggle("off", x.dataset.tipo !== tipoEscolhido)
        );
      };
    });

    $("#voltar").onclick = () => {
      const voltarParaHistorico = edit && edit.origem === "historico";
      edit = null;
      tipo = null;
      etapa = voltarParaHistorico ? "historico" : "colaborador";
      render();
    };

    let indiceSel = -1;
    function filtrar(termo) {
      const t = normalizar(termo);
      if (!t) return MODELOS.slice();
      const comeca = MODELOS.filter((m) => normalizar(m).startsWith(t));
      const contem = MODELOS.filter((m) => !normalizar(m).startsWith(t) && normalizar(m).includes(t));
      return comeca.concat(contem);
    }
    function destacar(modelo, termo) {
      const t = normalizar(termo);
      if (!t) return modelo;
      const idx = normalizar(modelo).indexOf(t);
      if (idx === -1) return modelo;
      return modelo.slice(0, idx) + "<b>" + modelo.slice(idx, idx + termo.length) + "</b>" + modelo.slice(idx + termo.length);
    }
    function abrir() {
      const termo = campoCarro.value;
      const lm = filtrar(termo);
      indiceSel = -1;
      if (!lm.length) {
        caixaSug.innerHTML = `<div class="vazio">Nenhum modelo encontrado. Você pode digitar mesmo assim.</div>`;
        caixaSug.hidden = false;
        return;
      }
      caixaSug.innerHTML = lm.map((m, i) =>
        `<button type="button" data-modelo="${m}" data-i="${i}">${destacar(m, termo)}</button>`
      ).join("");
      caixaSug.hidden = false;
      caixaSug.querySelectorAll("button").forEach((b) => {
        b.onmousedown = (e) => { e.preventDefault(); escolher(b.dataset.modelo); };
      });
    }
    function fechar() { caixaSug.hidden = true; indiceSel = -1; }
    function escolher(modelo) {
      campoCarro.value = modelo;
      fechar();
      campoPlaca.focus();
    }
    campoCarro.addEventListener("input", abrir);
    campoCarro.addEventListener("focus", abrir);
    campoCarro.addEventListener("blur", () => setTimeout(fechar, 180));
    campoCarro.addEventListener("keydown", (e) => {
      const botoes = caixaSug.querySelectorAll("button");
      if (!botoes.length || caixaSug.hidden) {
        if (e.key === "Enter") { e.preventDefault(); campoPlaca.focus(); }
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        indiceSel = Math.min(indiceSel + 1, botoes.length - 1);
        botoes.forEach((b, i) => b.classList.toggle("sel", i === indiceSel));
        botoes[indiceSel].scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        indiceSel = Math.max(indiceSel - 1, 0);
        botoes.forEach((b, i) => b.classList.toggle("sel", i === indiceSel));
        botoes[indiceSel].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        if (indiceSel >= 0) { e.preventDefault(); escolher(botoes[indiceSel].dataset.modelo); }
        else { e.preventDefault(); fechar(); campoPlaca.focus(); }
      } else if (e.key === "Escape") {
        fechar();
      }
    });

    campoPlaca.addEventListener("input", () => {
      campoPlaca.value = campoPlaca.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase().slice(0, 4);
    });

    caixaCores.innerHTML = CORES.map((c) =>
      `<button type="button" data-cor="${c.nome}">
        <span class="bolinha" style="background:${c.cor}"></span>${c.nome}
      </button>`
    ).join("");

    caixaCores.querySelectorAll("button").forEach((b) => {
      if (b.dataset.cor === corSelecionada) b.classList.add("on");
      b.onclick = () => {
        corSelecionada = b.dataset.cor;
        caixaCores.querySelectorAll("button").forEach((x) =>
          x.classList.toggle("on", x === b)
        );
      };
    });

    async function salvar() {
      const carro = campoCarro.value.trim();
      const placa = campoPlaca.value.trim().toUpperCase();
      if (!carro) { toast("Escolha o modelo do carro"); campoCarro.focus(); return; }
      if (placa.length < 4) { toast("Digite os 4 caracteres"); campoPlaca.focus(); return; }

      // Se o carro digitado não for BYD, vira "Outros" automaticamente.
      let tipoFinal = tipoEscolhido;
      if (!ehModeloBYD(carro)) {
        tipoFinal = "outros";
      }

      $("#salvar").disabled = true;
      const veioDoHistorico = edit && edit.origem === "historico";
      try {
        if (edit) {
          await api("PATCH", "lavagens/" + dia + "/" + edit.id, {
            tipo: tipoFinal, carro: carro, placa: placa, cor: corSelecionada
          });
        } else {
          dia = diaOperacional();
          await api("POST", "lavagens/" + dia, {
            nome: pessoa, tipo: tipoFinal, carro: carro, placa: placa, cor: corSelecionada, ts: Date.now()
          });
        }
        toast("Salvo");
        edit = null;
        tipo = null;
        etapa = veioDoHistorico ? "historico" : "colaborador";
        await carregar();
      } catch (e) {
        erro = e.message;
        edit = null;
        tipo = null;
        etapa = "colaborador";
        render();
      }
    }
    $("#salvar").onclick = salvar;
    campoPlaca.onkeydown = (e) => { if (e.key === "Enter") salvar(); };
  }

  function renderIda() {
    const v = $("#v");
    const botoesNomes = Object.keys(EQUIPE).map((nome) => {
      const total = idas.filter((i) => i.nome === nome).length;
      return `<button class="big nome" style="background:${EQUIPE[nome]}" data-nome="${nome}">
        ${nome}<small>${total} hoje</small>
      </button>`;
    }).join("");

    const recentes = idas.slice().reverse();
    const linhasIdas = recentes.length
      ? recentes.map((i) => `
          <div class="row">
            <div>
              <b style="color:${EQUIPE[i.nome] || "inherit"}">${esc(i.nome)}</b>
              <small>${hora(i.ts)}</small>
            </div>
            <button class="act del" data-excluir="${i.id}">Excluir</button>
          </div>`).join("")
      : `<div class="row" style="color:var(--mut)">Ninguém foi ao showroom hoje</div>`;

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <h1>Idas no Showroom</h1>
        <p class="data-destaque">${textoDataDestaque()}<small>Toque no nome para registrar agora</small></p>
      </div>
      ${avisoErro(erroIda)}
      <div class="stack">${botoesNomes}</div>
      <div class="sec">
        <h3>Hoje (${idas.length})</h3>
        ${linhasIdas}
      </div>`;

    $("#voltar").onclick = () => { etapa = "inicio"; carregar(); };
    v.querySelectorAll("[data-nome]").forEach((b) => {
      b.onclick = () => registrarIda(b.dataset.nome);
    });
    v.querySelectorAll("[data-excluir]").forEach((b) => {
      b.onclick = () => excluirIda(b.dataset.excluir);
    });
  }

  function renderHistorico() {
    const v = $("#v");

    // Filtro de busca
    const termo = normalizar(busca);
    const listaFiltrada = termo
      ? lista.filter((r) => {
          const alvo = [
            r.placa || "",
            r.carro || "",
            r.cor || "",
            r.nome || "",
            TIPOS[r.tipo] || ""
          ].join(" ");
          return normalizar(alvo).includes(termo);
        })
      : lista;

    // Blocos por pessoa
    let blocos = "";
    if (termo && listaFiltrada.length === 0) {
      blocos = `<div class="busca-vazio">Nenhum carro encontrado para "${esc(busca)}".</div>`;
    } else {
      blocos = Object.keys(EQUIPE).map((nome) => {
        const meus = listaFiltrada.filter((r) => r.nome === nome).slice().reverse();
        if (termo && meus.length === 0) return "";
        const linhas = meus.length
          ? meus.map((r) => {
              const partesInfo = [];
              if (r.carro) partesInfo.push(r.carro);
              if (r.cor) partesInfo.push(r.cor);
              const info = partesInfo.length ? partesInfo.join(" · ") : "—";
              return `
                <div class="carro-linha">
                  <span class="placa">${esc(r.placa)}</span>
                  <span class="info">
                    <b>${esc(info)}</b>
                    <small>${hora(r.ts)}</small>
                  </span>
                  <span class="tipo" style="background:${CORES_TIPO[r.tipo] || "#666"}">${TIPOS[r.tipo] || r.tipo}</span>
                  <span class="acoes">
                    <button class="ed" data-editar="${r.id}">Alterar</button>
                    <button class="del" data-excluir-carro="${r.id}">Excluir</button>
                  </span>
                </div>`;
            }).join("")
          : `<div class="row" style="color:var(--mut)">Nenhum carro hoje</div>`;

        return `
          <div class="bloco-pessoa" style="--cor:${EQUIPE[nome]}">
            <h3>${esc(nome)}<small>${meus.length} carro${meus.length === 1 ? "" : "s"}</small></h3>
            ${linhas}
          </div>`;
      }).join("");
      if (!blocos.trim()) {
        blocos = `<div class="busca-vazio">Nenhum carro encontrado para "${esc(busca)}".</div>`;
      }
    }

    v.innerHTML = `
      <button class="back" id="voltar">‹ Voltar</button>
      <div class="topo-tela">
        <h1>Histórico de hoje</h1>
        <p class="data-destaque">${textoDataDestaque()}<small>${lista.length} carro${lista.length === 1 ? "" : "s"} lavado${lista.length === 1 ? "" : "s"}</small></p>
        <input id="busca" class="busca" type="text" placeholder="Buscar por chassi, carro, cor…" value="${esc(busca)}" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      ${avisoErro(erro)}
      ${blocos}`;

    $("#voltar").onclick = () => { busca = ""; etapa = "inicio"; carregar(); };

    const campoBusca = $("#busca");
    campoBusca.addEventListener("input", () => {
      busca = campoBusca.value;
      const listaAntiga = v.querySelectorAll(".bloco-pessoa, .busca-vazio");
      listaAntiga.forEach((el) => el.remove());

      const termo2 = normalizar(busca);
      const filtrados = termo2
        ? lista.filter((r) => {
            const alvo = [r.placa || "", r.carro || "", r.cor || "", r.nome || "", TIPOS[r.tipo] || ""].join(" ");
            return normalizar(alvo).includes(termo2);
          })
        : lista;

      let html = "";
      if (termo2 && filtrados.length === 0) {
        html = `<div class="busca-vazio">Nenhum carro encontrado para "${esc(busca)}".</div>`;
      } else {
        html = Object.keys(EQUIPE).map((nome) => {
          const meus = filtrados.filter((r) => r.nome === nome).slice().reverse();
          if (termo2 && meus.length === 0) return "";
          const linhas = meus.length
            ? meus.map((r) => {
                const partesInfo = [];
                if (r.carro) partesInfo.push(r.carro);
                if (r.cor) partesInfo.push(r.cor);
                const info = partesInfo.length ? partesInfo.join(" · ") : "—";
                return `
                  <div class="carro-linha">
                    <span class="placa">${esc(r.placa)}</span>
                    <span class="info">
                      <b>${esc(info)}</b>
                      <small>${hora(r.ts)}</small>
                    </span>
                    <span class="tipo" style="background:${CORES_TIPO[r.tipo] || "#666"}">${TIPOS[r.tipo] || r.tipo}</span>
                    <span class="acoes">
                      <button class="ed" data-editar="${r.id}">Alterar</button>
                      <button class="del" data-excluir-carro="${r.id}">Excluir</button>
                    </span>
                  </div>`;
              }).join("")
            : `<div class="row" style="color:var(--mut)">Nenhum carro hoje</div>`;
          return `
            <div class="bloco-pessoa" style="--cor:${EQUIPE[nome]}">
              <h3>${esc(nome)}<small>${meus.length} carro${meus.length === 1 ? "" : "s"}</small></h3>
              ${linhas}
            </div>`;
        }).join("");
        if (!html.trim()) {
          html = `<div class="busca-vazio">Nenhum carro encontrado para "${esc(busca)}".</div>`;
        }
      }

      campoBusca.insertAdjacentHTML("afterend", html);
      v.querySelectorAll("[data-editar]").forEach((b) => {
        b.onclick = () => {
          const r = lista.find((x) => x.id === b.dataset.editar);
          if (!r) return;
          pessoa = r.nome;
          tipo = r.tipo;
          edit = {
            id: r.id, k: r.tipo, carro: r.carro || "",
            placa: r.placa || "", cor: r.cor || "", origem: "historico"
          };
          etapa = "formulario";
          render();
        };
      });
      v.querySelectorAll("[data-excluir-carro]").forEach((b) => {
        b.onclick = () => excluirCarro(b.dataset.excluirCarro);
      });
    });

    v.querySelectorAll("[data-editar]").forEach((b) => {
      b.onclick = () => {
        const r = lista.find((x) => x.id === b.dataset.editar);
        if (!r) return;
        pessoa = r.nome;
        tipo = r.tipo;
        edit = {
          id: r.id, k: r.tipo, carro: r.carro || "",
          placa: r.placa || "", cor: r.cor || "", origem: "historico"
        };
        etapa = "formulario";
        render();
      };
    });

    v.querySelectorAll("[data-excluir-carro]").forEach((b) => {
      b.onclick = () => excluirCarro(b.dataset.excluir-carro);
    });
  }

  // ---------- Início ----------
  carregar();

  let diaAtualVisivel = diaOperacional();
  setInterval(() => {
    const novoDia = diaOperacional();
    if (novoDia !== diaAtualVisivel) {
      diaAtualVisivel = novoDia;
      carregar();
    }
  }, 30000);
</script>
</body>
</html>
